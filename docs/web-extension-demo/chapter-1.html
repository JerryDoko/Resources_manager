<h1 class="chapter-title">第一章 旧信箱</h1>
<article class="chapter"><p>秋天的第一阵风吹到码头时，林晓正在给旧信箱刷漆。信箱已经三年没有收到信，她却总把里面擦得干干净净。</p><p>傍晚，一只白色纸船停在信箱前的水洼里。纸船上没有名字，只写着一句话：“明天日落前，到灯塔来看一看。”</p><p>林晓把纸船展开，发现背面是一张她小时候画过的海岸地图。地图最远的地方，画着一盏小小的灯。</p></article>

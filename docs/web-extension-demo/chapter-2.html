<h1 class="chapter-title">第二章 灯亮的时候</h1>
<article class="chapter"><p>林晓沿着海岸走到灯塔。夕阳把铁门照成暖红色，门口站着一位提工具箱的老人。他说，灯塔今晚就能重新亮起来。</p><p>“那封信是您写的吗？”林晓问。老人摇了摇头，从工具箱里拿出一叠旧地图：“是你以前留下的邀请。我们都还记得。”</p><p>小镇的人陆续来了，有人带了面包，有人带了折好的纸船。第一束灯光扫过海面时，林晓发现信箱并不是在等待过去。它还可以装下许多明天的消息。</p></article>

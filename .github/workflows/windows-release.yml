name: Build Windows

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    # node-gyp 10 does not yet recognize the Visual Studio 2026 image.
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20.15.1
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Windows packages
        run: npm run release:win

      - name: Verify packaged runtime
        shell: pwsh
        run: |
          $node = Join-Path $PWD "dist-pack/node/node.exe"
          & $node -e 'const Database=require("better-sqlite3");const db=new Database(":memory:");db.exec("create table ok(id integer)");db.close();console.log("SQLite runtime OK")'

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Resources-Manager-${{ github.sha }}-windows-x64
          path: release/*.exe
          if-no-files-found: error

      - name: Upload to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: release/*.exe

<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'">
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; padding: 12px 16px; background: #fafbf9; color: #172033; font: 13px -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
    .row { display: flex; align-items: center; gap: 8px; }
    #address { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: #607084; }
    button { flex-shrink: 0; height: 32px; padding: 0 10px; border: 1px solid #d5dce6; border-radius: 6px; background: white; color: inherit; cursor: pointer; font: inherit; }
    button:hover { background: #f0edf9; }
    #continue { background: #793bf0; border-color: #793bf0; color: white; }
    #status { margin: 10px 0 0; line-height: 20px; overflow: hidden; max-height: 40px; }
  </style>
</head>
<body>
  <div class="row"><span id="address"></span><button id="return">返回原章节</button><button id="reload" title="刷新网页">刷新</button><button id="continue">继续读取</button><button id="close">取消导入</button></div>
  <p id="status" role="status">正在打开网页…</p>
</body>
</html>

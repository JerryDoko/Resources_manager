plugins {
    id "com.android.application"
}

def appVersion = providers.gradleProperty("appVersion").orElse("1.1.7").get()
def buildNumber = providers.gradleProperty("versionCode").orElse("10500").get().toInteger()

android {
    namespace "com.jerrydoko.resourcesmanager"
    compileSdk 35

    defaultConfig {
        applicationId "com.jerrydoko.resourcesmanager"
        minSdk 26
        targetSdk 35
        versionCode buildNumber
        versionName appVersion
    }

    signingConfigs {
        release {
            storeFile file("resources-manager-dev.jks")
            storePassword "android"
            keyAlias "androiddebugkey"
            keyPassword "android"
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    applicationVariants.configureEach { variant ->
        variant.outputs.configureEach {
            outputFileName = "Resources-Manager-${appVersion}-android-universal.apk"
        }
    }
}
